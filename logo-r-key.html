<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логотип ПроРемонт</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .logo-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .logo-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        svg {
            display: block;
        }
    </style>
</head>
<body>

<div class="logo-card">
    <div class="logo-label">ПроРемонт — буква Р как ключ (круглая головка)</div>
    <svg width="480" height="120" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg">
        <!-- Буква Р с круглой петлей как головка ключа -->
        <circle cx="35" cy="30" r="15" stroke="#1e3a5f" stroke-width="4" fill="none"/>
        <line x1="35" y1="45" x2="35" y2="95" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Зубцы ключа -->
        <line x1="35" y1="65" x2="45" y2="65" stroke="#c9a962" stroke-width="4" stroke-linecap="round"/>
        <line x1="35" y1="80" x2="43" y2="80" stroke="#c9a962" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Текст «РоРемонт» -->
        <text x="80" y="58" font-family="Inter, sans-serif" font-weight="700" font-size="48" fill="#1e3a5f" letter-spacing="-0.02em">роРемонт</text>
    </svg>
</div>

</body>
</html>
