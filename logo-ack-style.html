<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логотип РемонтПро — стиль ACK</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 80px;
        }
        .logo-card {
            background: white;
            padding: 80px 100px;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .logo-text {
            font-size: 72px;
            font-weight: 800;
            letter-spacing: 0.02em;
            line-height: 1;
        }
        .logo-remont {
            color: #1e3a5f;
        }
        .logo-pro {
            color: #c9a962;
        }
        .logo-subtitle {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #666;
        }
        .logo-dark {
            background: #1a1a1a;
        }
        .logo-dark .logo-remont {
            color: #ffffff;
        }
        .logo-dark .logo-pro {
            color: #c9a962;
        }
        .logo-dark .logo-subtitle {
            color: #999;
        }
        .logo-compact {
            font-size: 48px;
        }
        .label {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div>
        <div class="label">Основной логотип</div>
        <div class="logo-card">
            <div class="logo-text">
                <span class="logo-remont">Ремонт</span><span class="logo-pro">Про</span>
            </div>
            <div class="logo-subtitle">комплексный ремонт квартир</div>
        </div>
    </div>

    <div>
        <div class="label">На тёмном фоне</div>
        <div class="logo-card logo-dark">
            <div class="logo-text">
                <span class="logo-remont">Ремонт</span><span class="logo-pro">Про</span>
            </div>
            <div class="logo-subtitle">комплексный ремонт квартир</div>
        </div>
    </div>

    <div>
        <div class="label">Компактный вариант</div>
        <div class="logo-card">
            <div class="logo-text logo-compact">
                <span class="logo-remont">Ремонт</span><span class="logo-pro">Про</span>
            </div>
        </div>
    </div>
</body>
</html>
